<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Park - Futuristic Autonomous Parking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: "Inter", Arial, sans-serif;
    color: #172033;
}

body {
    background:
        linear-gradient(rgba(24, 157, 203, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 157, 203, 0.07) 1px, transparent 1px),
        radial-gradient(circle at 5% 15%, rgba(0, 190, 230, 0.20), transparent 28%),
        radial-gradient(circle at 95% 70%, rgba(100, 80, 255, 0.15), transparent 28%),
        #f4fbfe;

    background-size: 27px 27px;
}

/* =========================
   TOP NAVIGATION
========================= */

.topbar {
    height: 104px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid #dceaf0;

    display: flex;
    align-items: center;
}

.topbar-inner {
    width: min(1120px, calc(100% - 48px));
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-mark {
    width: 45px;
    height: 45px;

    border-radius: 15px;

    display: grid;
    place-items: center;

    background: linear-gradient(135deg, #5149ee, #2276f2);

    color: white;

    border: 3px solid #70dff1;

    font-size: 22px;

    box-shadow: 0 9px 18px rgba(44, 91, 235, 0.25);
}

.brand-name {
    font-size: 24px;
    font-weight: 900;
    color: #29458f;
}

.brand-sub {
    display: block;

    font-size: 9px;

    letter-spacing: 1.3px;

    color: #08a4c5;

    font-weight: 800;
}

.top-actions {
    display: flex;
    gap: 14px;
}

.outline-btn {
    padding: 11px 17px;

    border: 1px solid #bdeefa;

    border-radius: 15px;

    background: white;

    color: #354052;

    font-weight: 700;

    cursor: pointer;

    box-shadow: 0 4px 12px rgba(40, 160, 194, 0.07);
}

.outline-btn:hover {
    background: #f4fcff;
}

.danger-text {
    color: #ef4560;
}

/* =========================
   MAIN
========================= */

.main {
    width: min(1120px, calc(100% - 48px));
    margin: auto;

    padding: 38px 0 70px;
}

.page-head,
.customer-head {
    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    gap: 24px;

    margin-bottom: 30px;
}

.page-title {
    font-size: 34px;

    line-height: 1.15;

    font-weight: 900;

    letter-spacing: -1px;

    margin: 0;
}

.page-subtitle,
.customer-head p {
    font-size: 17px;

    color: #697589;

    font-weight: 500;

    margin: 7px 0 0;
}

/* =========================
   ADMIN TABS
========================= */

.glass-tabs {
    display: flex;

    gap: 3px;

    padding: 5px;

    border: 1px solid #bdebf6;

    background: rgba(255, 255, 255, 0.85);

    border-radius: 16px;

    overflow: auto;
}

.tab {
    white-space: nowrap;

    padding: 11px 15px;

    border-radius: 12px;

    background: transparent;

    color: #536075;

    font-weight: 800;

    font-size: 13px;

    border: 0;

    cursor: pointer;
}

.tab.active {
    color: white;

    background: linear-gradient(
        135deg,
        #0b9fbd,
        #4a45e9
    );

    box-shadow: 0 7px 17px rgba(51, 93, 232, 0.25);
}

/* =========================
   STAT CARDS
========================= */

.grid-4 {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 20px;
}

.stat-card {
    min-height: 106px;

    background: rgba(255, 255, 255, 0.87);

    border: 1px solid #dce8ef;

    border-radius: 22px;

    padding: 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    box-shadow: 0 8px 24px rgba(37, 76, 104, 0.09);
}

.stat-card.cyan {
    border-color: #bdeef7;

    background: linear-gradient(
        135deg,
        rgba(17, 181, 218, 0.10),
        white
    );
}

.stat-card.green {
    border-color: #c6f0df;

    background: linear-gradient(
        135deg,
        rgba(16, 185, 129, 0.09),
        white
    );
}

.stat-card.amber {
    border-color: #f6e5ae;

    background: linear-gradient(
        135deg,
        rgba(245, 158, 11, 0.09),
        white
    );
}

.stat-card.indigo {
    border-color: #dce0ff;

    background: linear-gradient(
        135deg,
        rgba(79, 70, 229, 0.08),
        white
    );
}

.stat-label {
    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 0.9px;

    color: #8b96a8;
}

.stat-value {
    font-size: 29px;

    font-weight: 900;

    margin-top: 7px;
}

.stat-value small {
    font-size: 13px;

    color: #98a2b2;
}

.stat-icon {
    width: 51px;
    height: 51px;

    border-radius: 16px;

    display: grid;

    place-items: center;

    font-size: 24px;
}

.cyan .stat-icon {
    background: #e9fbff;

    color: #08a3c5;
}

.green .stat-icon {
    background: #eafaf3;

    color: #08a873;
}

.amber .stat-icon {
    background: #fff9e7;

    color: #ef9400;
}

.indigo .stat-icon {
    background: #eef0ff;

    color: #4b45e8;
}

/* =========================
   CHARTS
========================= */

.chart-grid {
    display: grid;

    grid-template-columns: 1.55fr 1fr;

    gap: 28px;

    margin-top: 30px;
}

.panel {
    background: rgba(255, 255, 255, 0.88);

    border: 1px solid #dbe7ed;

    border-radius: 22px;

    box-shadow: 0 18px 45px rgba(37, 76, 104, 0.10);

    padding: 24px;
}

.panel-title {
    font-size: 18px;

    font-weight: 900;

    margin: 0 0 20px;

    display: flex;

    align-items: center;

    gap: 9px;
}

.ico {
    color: #009fc1;
}

.chart-box {
    height: 300px;
}

.chart-box canvas {
    width: 100%;
    height: 100%;
}

/* =========================
   DONUT
========================= */

.donut-wrap {
    height: 300px;

    display: grid;

    place-items: center;

    position: relative;
}

.donut {
    width: 190px;
    height: 190px;

    border-radius: 50%;

    background:
        conic-gradient(
            #10b981 0 73%,
            #f59e0b 73% 100%
        );

    position: relative;
}

.donut::after {
    content: "";

    position: absolute;

    inset: 42px;

    border-radius: 50%;

    background: white;
}

.donut-center {
    position: absolute;

    text-align: center;
}

.donut-center strong {
    font-size: 27px;
}

.donut-center span {
    display: block;

    font-size: 11px;

    color: #8b96a8;

    font-weight: 700;
}

.legend {
    display: flex;

    justify-content: center;

    gap: 20px;

    flex-wrap: wrap;

    margin-top: -30px;

    font-size: 12px;

    font-weight: 800;
}

.dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    display: inline-block;

    margin-right: 5px;
}

.dot.green {
    background: #10b981;
}

.dot.amber {
    background: #f59e0b;
}

.dot.red {
    background: #ef4444;
}

/* =========================
   FORM
========================= */

.form-panel {
    margin-bottom: 25px;
}

.form-grid {
    display: grid;

    grid-template-columns:
        1fr
        1.3fr
        0.8fr
        auto;

    gap: 14px;

    align-items: end;
}

.field label {
    display: block;

    font-size: 12px;

    font-weight: 800;

    color: #536075;

    margin-bottom: 7px;
}

.field input {
    width: 100%;

    height: 47px;

    border: 1px solid #cfe5ed;

    border-radius: 14px;

    padding: 0 14px;

    background: white;

    color: #263246;

    outline: none;
}

.field input:focus {
    border-color: #52d7ee;

    box-shadow: 0 0 0 4px rgba(19, 184, 218, 0.10);
}

.primary-btn {
    height: 47px;

    padding: 0 19px;

    border-radius: 14px;

    color: white;

    font-weight: 800;

    background: linear-gradient(
        135deg,
        #0a9fbd,
        #315df1
    );

    box-shadow: 0 10px 20px rgba(36, 113, 235, 0.22);

    border: 0;

    cursor: pointer;
}

.primary-btn:hover {
    transform: translateY(-1px);
}

/* =========================
   SECTION HEADINGS
========================= */

.section-heading {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}

.section-heading h3 {
    font-size: 20px;

    font-weight: 900;

    margin: 0;
}

.search {
    width: 280px;

    height: 43px;

    border: 1px solid #d5e6ed;

    background: white;

    border-radius: 13px;

    padding: 0 14px;

    outline: none;
}

.search:focus {
    border-color: #55d5eb;
}

/* =========================
   PARKING LOTS
========================= */

.lot-grid {
    display: grid;

    grid-template-columns: repeat(5, 1fr);

    gap: 15px;
}

.lot-card {
    padding: 17px;

    background: white;

    border: 1px solid #dbe5eb;

    border-radius: 17px;

    box-shadow: 0 5px 15px rgba(20, 70, 100, 0.05);
}

.lot-top {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 6px;
}

.lot-number {
    font-size: 18px;

    font-weight: 900;
}

.status {
    font-size: 9px;

    font-weight: 900;

    text-transform: uppercase;

    padding: 5px 8px;

    border-radius: 999px;
}

.status.available {
    background: #e9faf3;

    color: #07895f;
}

.status.booked {
    background: #fff4d8;

    color: #b87500;
}

.status.maintenance {
    background: #fff0f0;

    color: #c93636;
}

.lot-location {
    font-size: 11px;

    color: #7b8798;

    margin: 9px 0 4px;
}

.lot-price {
    font-size: 14px;

    color: #0098bb;

    font-weight: 900;
}

.lot-actions {
    display: flex;

    gap: 8px;

    margin-top: 14px;

    padding-top: 12px;

    border-top: 1px solid #edf1f3;
}

.small-btn,
.action-btn {
    padding: 8px 10px;

    border: 0;

    border-radius: 10px;

    font-size: 11px;

    font-weight: 800;

    background: #f2fbff;

    color: #078bab;

    cursor: pointer;
}

.small-btn.warn {
    background: #fff8e8;

    color: #d18a00;
}

.small-btn.ok,
.action-btn.verify {
    background: #eafaf2;

    color: #07895f;
}

.small-btn.delete {
    margin-left: auto;

    background: #fff0f0;

    color: #d83c4c;
}

/* =========================
   TABLES
========================= */

.table-wrap {
    overflow: auto;
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 760px;
}

th {
    text-align: left;

    padding: 0 12px 13px;

    color: #929bab;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 0.8px;

    border-bottom: 1px solid #e5ebef;
}

td {
    padding: 15px 12px;

    border-bottom: 1px solid #eef2f4;

    font-size: 13px;

    color: #586476;

    font-weight: 500;
}

td strong {
    color: #182235;

    font-weight: 900;
}

tbody tr:hover {
    background: #f3fbfe;
}

.id {
    font-family: monospace;

    color: #059cbc;

    font-weight: 900;
}

.money {
    color: #069765;

    font-weight: 900;
}

.action-btn {
    background: #fff0f0;

    color: #dc3d50;
}

.empty {
    text-align: center;

    padding: 35px;

    color: #8b95a5;
}

/* =========================
   LOGIN
========================= */

.login-page {
    min-height: 100vh;

    display: grid;

    place-items: center;

    padding: 28px;
}

.login-card {
    width: min(530px, 100%);

    background: rgba(255, 255, 255, 0.95);

    border: 1px solid #e1eaf0;

    border-radius: 28px;

    padding: 28px;

    box-shadow: 0 30px 70px rgba(30, 80, 110, 0.12);
}

.login-logo {
    width: 76px;
    height: 76px;

    border-radius: 25px;

    margin: 0 auto 25px;

    display: grid;

    place-items: center;

    background: #e8f8ff;

    color: #079fc0;

    font-size: 38px;

    box-shadow: 0 0 0 8px rgba(210, 245, 255, 0.45);
}

.login-title {
    text-align: center;

    font-size: 34px;

    font-weight: 900;

    letter-spacing: -1.1px;

    margin: 0;
}

.login-sub {
    text-align: center;

    color: #737e90;

    font-size: 16px;

    font-weight: 600;

    margin: 8px 0 35px;
}

.login-tabs {
    display: grid;

    grid-template-columns: 1fr 1fr;

    background: #f4f5f6;

    border: 1px solid #e7e8e9;

    border-radius: 19px;

    padding: 5px;

    margin-bottom: 30px;
}

.login-tab {
    height: 57px;

    border: 0;

    border-radius: 14px;

    background: transparent;

    color: #737d8d;

    font-weight: 900;

    font-size: 16px;

    cursor: pointer;
}

.login-tab.active {
    background: white;

    color: #087f9c;

    box-shadow: 0 6px 13px rgba(20, 40, 60, 0.10);
}

.login-form .field {
    margin-bottom: 20px;
}

.login-form .field label {
    font-size: 16px;

    color: #394457;
}

.login-form input {
    height: 61px;

    border-color: #bcebf4;

    border-radius: 16px;

    font-size: 16px;

    padding: 0 20px;
}

.login-submit {
    width: 100%;

    height: 70px;

    border-radius: 16px;

    margin-top: 10px;

    font-size: 18px;
}

.demo-note {
    text-align: center;

    font-size: 11px;

    color: #8993a3;
}

/* =========================
   CUSTOMER SLOT SCREEN
========================= */

.customer-head h1 {
    font-size: 32px;

    font-weight: 900;

    margin: 0;
}

.profile-pill {
    padding: 11px 17px;

    border-radius: 15px;

    background: white;

    border: 1px solid #c9edf5;

    font-weight: 800;
}

.status-key {
    display: flex;

    gap: 20px;

    align-items: center;

    padding: 10px 15px;

    border-radius: 15px;

    background: white;

    border: 1px solid #c9edf5;

    font-size: 12px;

    font-weight: 800;
}

.key-item {
    display: flex;

    align-items: center;

    gap: 7px;
}

.key-circle {
    width: 14px;
    height: 14px;

    border-radius: 50%;

    background: #10b981;
}

.key-circle.booked {
    background: #e0e4e8;
}

.key-circle.selected {
    background: #087fa4;
}

.slot-panel {
    padding: 38px;

    border-radius: 24px;

    background: rgba(255, 255, 255, 0.88);

    border: 1px solid #dbe7ed;

    box-shadow: 0 18px 45px rgba(37, 76, 104, 0.10);
}

.slot-grid {
    display: grid;

    grid-template-columns: repeat(10, 1fr);

    gap: 15px;
}

.slot {
    min-height: 120px;

    border-radius: 16px;

    border: 1px solid #c8dfe8;

    background: #f7fafb;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 7px;

    transition: 0.2s;

    color: #b9c2cd;
}

.slot.available {
    background: white;

    border-color: #16c99a;

    color: #05b783;

    cursor: pointer;
}

.slot.available:hover {
    transform: translateY(-3px);

    box-shadow: 0 9px 20px rgba(16, 185, 129, 0.15);
}

.slot.selected {
    background: linear-gradient(160deg, #079ab9, #285ce8);

    border-color: #087fa4;

    color: white;

    box-shadow: 0 12px 22px rgba(8, 127, 164, 0.25);
}

.slot:disabled {
    cursor: not-allowed;
}

.car-icon {
    font-size: 22px;
}

.slot strong {
    font-size: 16px;
}

.price-pill {
    font-size: 10px;

    font-weight: 900;

    background: #dff9ed;

    color: #07895f;

    padding: 4px 8px;

    border-radius: 999px;
}

.selected .price-pill {
    background: rgba(255, 255, 255, 0.20);

    color: white;
}

.booking-bar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-top: 22px;

    padding: 18px 20px;

    background: white;

    border: 1px solid #dce8ee;

    border-radius: 17px;
}

.booking-info {
    font-weight: 800;
}

.booking-info span {
    color: #078eae;
}

.booking-bar .primary-btn:disabled {
    opacity: 0.45;

    cursor: not-allowed;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    right: 25px;

    bottom: 25px;

    background: #172033;

    color: white;

    padding: 13px 17px;

    border-radius: 13px;

    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);

    font-size: 13px;

    font-weight: 700;

    opacity: 0;

    transform: translateY(15px);

    pointer-events: none;

    transition: 0.25s;

    z-index: 100;
}

.toast.show {
    opacity: 1;

    transform: translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {

    .grid-4 {
        grid-template-columns: repeat(2, 1fr);
    }

    .chart-grid {
        grid-template-columns: 1fr;
    }

    .lot-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .slot-grid {
        grid-template-columns: repeat(5, 1fr);
    }

    .page-head {
        align-items: flex-start;

        flex-direction: column;
    }

    .form-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 650px) {

    .topbar {
        height: auto;

        padding: 15px 0;
    }

    .topbar-inner,
    .main {
        width: calc(100% - 26px);
    }

    .brand-name {
        font-size: 20px;
    }

    .top-actions .outline-btn {
        padding: 9px 11px;

        font-size: 11px;
    }

    .main {
        padding-top: 25px;
    }

    .page-title {
        font-size: 28px;
    }

    .page-subtitle {
        font-size: 14px;
    }

    .grid-4 {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 17px;
    }

    .chart-box,
    .donut-wrap {
        height: 245px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .lot-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .section-heading {
        align-items: stretch;

        flex-direction: column;
    }

    .search {
        width: 100%;
    }

    .slot-panel {
        padding: 18px;
    }

    .slot-grid {
        grid-template-columns: repeat(3, 1fr);

        gap: 10px;
    }

    .slot {
        min-height: 105px;
    }

    .customer-head {
        align-items: flex-start;

        flex-direction: column;
    }

    .status-key {
        width: 100%;

        justify-content: center;
    }

    .booking-bar {
        align-items: stretch;

        flex-direction: column;
    }

    .login-card {
        padding: 22px 18px;
    }

    .login-title {
        font-size: 28px;
    }
}
/* =========================================================
   SECURE CHECKOUT + QR TICKET
========================================================= */

.customer-main {
    padding-bottom: 145px;
}

.fixed-booking-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 90;
    margin: 0;
    min-height: 86px;
    padding: 12px 32px;
    border-radius: 0;
    border-left: 0;
    border-right: 0;
    border-bottom: 0;
    box-shadow: 0 -8px 30px rgba(35, 72, 98, 0.10);
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px);
}

.fixed-booking-bar .booking-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.selected-label {
    color: #8b98a8;
    font-size: 10px;
    letter-spacing: 0.8px;
    font-weight: 800;
}

.selected-price {
    color: #087fa4;
    font-size: 14px;
    margin-left: 4px;
}

.booking-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.secondary-btn {
    min-width: 94px;
    min-height: 49px;
    padding: 12px 20px;
    border: 1px solid #bcecf6;
    border-radius: 12px;
    background: #fff;
    color: #263246;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(35, 76, 105, 0.06);
}

.secondary-btn:hover {
    background: #f5fcff;
}

.payment-btn {
    min-width: 245px;
}

        const name =
            document.getElementById("customerName").value.trim();

        const email =
            document.getElementById("customerEmail").value.trim();

        const phone =
            document.getElementById("customerPhone").value.trim();


        session = {
            role: "customer",
            name,
            email,
            phone
        };


        const alreadyExists =
            customers.some(
                customer =>
                    customer.email.toLowerCase() ===
                    email.toLowerCase()
            );


        if (!alreadyExists) {

            customers.push({

                id: Date.now(),

                name,

                email,

                phone,

                joinedDate: "10 Sep 2026",

                status: "verified"

            });

            saveData(
                STORAGE.customers,
                customers
            );

        }

    }


    saveData(
        STORAGE.session,
        session
    );


    render();

/* =========================================================
   REVENUE GRAPH
========================================================= */

function drawRevenueChart() {

    const canvas =
        document.getElementById(
            "revenueCanvas"
        );


    if (!canvas) return;


    const container =
        canvas.parentElement;


    const ratio =
        window.devicePixelRatio || 1;


    const width =
        container.clientWidth;


    const height =
        container.clientHeight;


    canvas.width =
        width * ratio;


    canvas.height =
        height * ratio;


    const ctx =
        canvas.getContext("2d");


    ctx.scale(
        ratio,
        ratio
    );


    const values = [
        220,
        340,
        290,
        410,
        520,
        450,
        310
    ];


    const labels = [
        "09-04",
        "09-05",
        "09-06",
        "09-07",
        "09-08",
        "09-09",
        "09-10"
    ];


    const left =
        45;

    const right =
        15;

    const top =
        12;

    const bottom =
        38;


    const chartWidth =
        width - left - right;


    const chartHeight =
        height - top - bottom;


    const maxValue =
        550;


    ctx.font =
        "11px Inter";


    ctx.strokeStyle =
        "#e3ebef";


    ctx.fillStyle =
        "#687386";


    for (
        let i = 0;
        i <= 4;
        i++
    ) {

        const y =
            top +
            chartHeight -
            i *
            chartHeight /
            4;


        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            width - right,
            y
        );

        ctx.stroke();


        ctx.fillText(
            Math.round(
                maxValue *
                i /
                4
            ),
            8,
            y + 4
        );

    }


    const gap =
        chartWidth /
        values.length;


    const barWidth =
        Math.min(
            38,
            gap * 0.55
        );


    values.forEach(
        function (value, index) {

            const x =
                left +
                index *
                gap +
                (gap - barWidth) /
                2;


            const barHeight =
                chartHeight *
                value /
                maxValue;


            const y =
                top +
                chartHeight -
                barHeight;


            ctx.fillStyle =
                "#12a8d8";


            ctx.beginPath();

            ctx.roundRect(
                x,
                y,
                barWidth,
                barHeight,
                8
            );

            ctx.fill();


            ctx.fillStyle =
                "#687386";


            ctx.textAlign =
                "center";


            ctx.fillText(
                labels[index],
                x + barWidth / 2,
                height - 13
            );

        }
    );


    ctx.textAlign =
        "start";

}

                <div class="lot-card">


                    <div class="lot-top">


                        <span class="lot-number">
                            ${escapeHTML(lot.number)}
                        </span>


                        <span
                            class="status ${lot.status}"
                        >
                            ${lot.status}
                        </span>


                    </div>


                    <div class="lot-location">
                        ${escapeHTML(lot.location)}
                    </div>


                    <div class="lot-price">
                        ₹${lot.price}
                    </div>


                    <div class="lot-actions">


                        ${
                            lot.status === "maintenance"

                            ?

                            `
                            <button
                                class="small-btn ok"
                                onclick="
                                    changeLotStatus(
                                        ${lot.id},
                                        'available'
                                    )
                                "
                            >
                                ✓ Available
                            </button>
                            `

                            :

                            `
                            <button
                                class="small-btn warn"
                                onclick="
                                    changeLotStatus(
                                        ${lot.id},
                                        'maintenance'
                                    )
                                "
                            >
                                ! Maintenance
                            </button>
                            `
                        }


                        <button
                            class="small-btn delete"
                            onclick="
                                deleteLot(${lot.id})
                            "
                        >
                            × Delete
                        </button>


                    </div>


                </div>

            `;

        }
    ).join("");

}


/* =========================================================
   FILTER LOTS
   ========================================================= */

function filterLots(search) {

    const grid =
        document.getElementById(
            "lotsGrid"
        );


    if (!grid) return;


    const query =
        search.toLowerCase();


    const filtered =
        lots.filter(
            function (lot) {

                return (
                    lot.number +
                    " " +
                    lot.location +
                    " " +
                    lot.status
                )
                .toLowerCase()
                .includes(query);

            }
        );


    grid.innerHTML =
        createLotCards(
            filtered
        );

}


/* =========================================================
   ADD LOT
   ========================================================= */

function addParkingLot(event) {

    event.preventDefault();


    const number =
        document
            .getElementById("lotNumber")
            .value
            .trim()
            .toUpperCase();


    const location =
        document
            .getElementById("lotLocation")
            .value
            .trim();


    const price =
        Number(
            document
                .getElementById("lotPrice")
                .value
        );


    const exists =
        lots.some(
            lot =>
                lot.number === number
        );


    if (exists) {

        showToast(
            "Lot already exists."
        );

        return;

    }


    lots.push({

        id:
            Date.now(),

        number,

        location,

        price,

        status:
            "available"

    });


    saveData(
        STORAGE.lots,
        lots
    );


    renderAdmin();


    showToast(
        `${number} created successfully.`
    );

}


/* =========================================================
   CHANGE LOT STATUS
   ========================================================= */

function changeLotStatus(
    id,
    newStatus
) {

    const lot =
        lots.find(
            item =>
                item.id === id
        );


    if (!lot) return;


    if (
        lot.status === "booked" &&
        newStatus === "maintenance"
    ) {

        showToast(
            "Booked spot cannot enter maintenance."
        );

        return;

    }


    lot.status =
        newStatus;


    saveData(
        STORAGE.lots,
        lots
    );


    renderAdmin();


    showToast(
        `${lot.number}: ${newStatus}`
    );

}


/* =========================================================
   DELETE LOT
   ========================================================= */

function deleteLot(id) {

    const lot =
        lots.find(
            item =>
                item.id === id
        );


    if (!lot) return;


    if (lot.status === "booked") {

        showToast(
            "Booked spots cannot be deleted."
        );

        return;

    }


    const confirmation =
        confirm(
            `Delete ${lot.number}?`
        );


    if (!confirmation) return;


    lots =
        lots.filter(
            item =>
                item.id !== id
        );


    saveData(
        STORAGE.lots,
        lots
    );


    renderAdmin();

}


/* =========================================================
   BOOKINGS
   ========================================================= */

function renderBookings() {

    const filteredBookings =
        bookings.filter(
            function (booking) {

                return (

                    booking.id +
                    " " +
                    booking.lotNumber +
                    " " +
                    booking.customerName +
                    " " +
                    booking.customerEmail

                )
                .toLowerCase()
                .includes(
                    bookingSearch.toLowerCase()
                );

            }
        );


    return `

        <section class="panel">


            <div class="section-heading">


                <h3>
                    All Bookings
                    (${filteredBookings.length})
                </h3>


                <input
                    class="search"
                    value="${escapeHTML(bookingSearch)}"
                    placeholder="Search customer or spot..."
                    oninput="
                        bookingSearch=this.value;
                        renderAdmin();
                    "
                >


            </div>


            <div class="table-wrap">


                <table>


                    <thead>

                        <tr>

                            <th>
                                Booking ID
                            </th>

                            <th>
                                Spot
                            </th>

                            <th>
                                Customer
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody>


                        ${
                            filteredBookings.length

                            ?

                            filteredBookings
                                .map(
                                    function (booking) {

                                        return `

                                            <tr>


                                                <td class="id">
                                                    ${escapeHTML(booking.id)}
                                                </td>


                                                <td>
                                                    <strong>
                                                        ${escapeHTML(booking.lotNumber)}
                                                    </strong>
                                                </td>


                                                <td>

                                                    <strong>
                                                        ${escapeHTML(booking.customerName)}
                                                    </strong>

                                                    <br>

                                                    <small>
                                                        ${escapeHTML(booking.customerEmail)}
                                                    </small>

                                                </td>


                                                <td>
                                                    ${escapeHTML(booking.date)}
                                                </td>


                                                <td class="money">
                                                    ₹${Number(booking.amount).toFixed(2)}
                                                </td>


                                                <td>

                                                    <span
                                                        class="status ${
                                                            booking.status === "active"
                                                            ? "available"
                                                            : booking.status === "completed"
                                                            ? "booked"
                                                            : "maintenance"
                                                        }"
                                                    >
                                                        ${booking.status}
                                                    </span>

                                                </td>


                                                <td>

                                                    ${
                                                        booking.status === "active"

                                                        ?

                                                        `
                                                        <button
                                                            class="action-btn"
                                                            onclick="
                                                                cancelBooking(
                                                                    '${booking.id}'
                                                                )
                                                            "
                                                        >
                                                            Cancel
                                                        </button>
                                                        `

                                                        :

                                                        "—"
                                                    }

                                                </td>


                                            </tr>

                                        `;

                                    }
                                )
                                .join("")

                            :

                            `
                            <tr>

                                <td
                                    colspan="7"
                                    class="empty"
                                >
                                    No bookings found.
                                </td>

                            </tr>
                            `
                        }


                    </tbody>


                </table>


            </div>


        </section>

    `;

}


/* =========================================================
   CANCEL BOOKING
   ========================================================= */

function cancelBooking(id) {

    const booking =
        bookings.find(
            item =>
                item.id === id
        );


    if (!booking) return;


    booking.status =
        "cancelled";


    const lot =
        lots.find(
            item =>
                item.number ===
                booking.lotNumber
        );


    if (lot) {

        lot.status =
            "available";

    }


    saveData(
        STORAGE.bookings,
        bookings
    );


    saveData(
        STORAGE.lots,
        lots
    );


    renderAdmin();


    showToast(
        "Booking cancelled."
    );

}


/* =========================================================
   CUSTOMERS
   ========================================================= */

function renderCustomers() {

    const filteredCustomers =
        customers.filter(
            function (customer) {

                return (

                    customer.name +
                    " " +
                    customer.email +
                    " " +
                    customer.phone

                )
                .toLowerCase()
                .includes(
                    customerSearch.toLowerCase()
                );

            }
        );


    return `

        <section class="panel">


            <div class="section-heading">


                <h3>
                    Registered Customers
                    (${filteredCustomers.length})
                </h3>


                <input
                    class="search"
                    value="${escapeHTML(customerSearch)}"
                    placeholder="Search customers..."
                    oninput="
                        customerSearch=this.value;
                        renderAdmin();
                    "
                >


            </div>


            <div class="table-wrap">


                <table>


                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Joined Date
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody>


                        ${
                            filteredCustomers
                                .map(
                                    function (customer) {

                                        return `

                                            <tr>


                                                <td>
                                                    <strong>
                                                        ${escapeHTML(customer.name)}
                                                    </strong>
                                                </td>


                                                <td
                                                    style="color:#079bbd"
                                                >
                                                    ${escapeHTML(customer.email)}
                                                </td>


                                                <td>
                                                    ${escapeHTML(customer.phone)}
                                                </td>


                                                <td>
                                                    ${escapeHTML(customer.joinedDate)}
                                                </td>


                                                <td>

                                                    <span
                                                        class="status ${
                                                            customer.status === "verified"
                                                            ? "available"
                                                            : "maintenance"
                                                        }"
                                                    >
                                                        ${customer.status}
                                                    </span>

                                                </td>


                                                <td>

                                                    <button
                                                        class="action-btn ${
                                                            customer.status === "verified"
                                                            ? ""
                                                            : "verify"
                                                        }"
                                                        onclick="
                                                            toggleCustomer(
                                                                ${customer.id}
                                                            )
                                                        "
                                                    >

                                                        ${
                                                            customer.status === "verified"
                                                            ? "Suspend"
                                                            : "Verify"
                                                        }

                                                    </button>

                                                </td>


                                            </tr>

                                        `;

                                    }
                                )
                                .join("")

                        }


                    </tbody>


                </table>


            </div>


        </section>

    `;

}


/* =========================================================
   VERIFY / SUSPEND CUSTOMER
   ========================================================= */

function toggleCustomer(id) {

    const customer =
        customers.find(
            item =>
                item.id === id
        );


    if (!customer) return;


    if (
        customer.status ===
        "verified"
    ) {

        customer.status =
            "suspended";

    }

    else {

        customer.status =
            "verified";

    }


    saveData(
        STORAGE.customers,
        customers
    );


    renderAdmin();


    showToast(
        `${customer.name}: ${customer.status}`
    );

}


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function () {

        if (
            session &&
            session.role === "admin" &&
            currentTab === "overview"
        ) {

            drawRevenueChart();

        }

    }
);


/* =========================================================
   START APPLICATION
   ========================================================= */

render();
    </script>
